<div class="mb-4 flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-end">
  <div>
    <h1 class="mb-1 text-[21px] font-semibold">Inventory</h1>
    <div class="text-[13px] text-muted-foreground">3 items below reorder level · 2 expiring within 60 days · 1 out of stock</div>
  </div>
  <button
    type="button"
    class="flex h-[34px] items-center whitespace-nowrap rounded-[7px] bg-primary px-3 text-[13px] font-medium text-primary-foreground hover:bg-primary-hover"
  >
    Receive stock
  </button>
</div>

<app-data-table [columns]="columns" [rows]="inventory.list()" minWidth="900px">
  <ng-template appCell="qty" let-row>
    <span [class]="row.qtyFlagged ? 'text-warning' : ''">{{ row.qty }}</span>
  </ng-template>
  <ng-template appCell="expiry" let-row>
    <span class="text-[12.5px]" [class]="row.expiryFlagged ? 'text-warning' : 'text-secondary-foreground'">{{ row.expiry }}</span>
  </ng-template>
  <ng-template appCell="status" let-row>
    <app-status-badge [tone]="$any(statusTone)[row.status]">{{ row.status }}</app-status-badge>
  </ng-template>
</app-data-table>
