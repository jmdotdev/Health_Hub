<div class="grid grid-cols-1 items-start gap-5 lg:grid-cols-[210px_1fr]">
  <nav class="overflow-x-auto rounded-[9px] border border-border bg-card p-2 lg:overflow-x-visible">
    <div class="flex gap-1 lg:flex-col">
      @for (item of navItems; track item) {
        <button
          type="button"
          (click)="activeNav.set(item)"
          class="rounded-md px-2.5 py-1.5 text-left text-[13px] whitespace-nowrap hover:bg-muted"
          [class]="activeNav() === item ? 'bg-accent font-semibold text-accent-foreground' : 'font-normal text-secondary-foreground'"
        >
          {{ item }}
        </button>
      }
    </div>
  </nav>

  <div>
    <h1 class="mb-1 text-[21px] font-semibold">Clinic information</h1>
    <div class="mb-4 text-[13px] text-muted-foreground">Shown on invoices, prescriptions and printed records.</div>

    <section class="mb-4 rounded-[9px] border border-border bg-card">
      <div class="grid grid-cols-1 gap-3.5 p-4 sm:grid-cols-2">
        <app-form-field label="Clinic name">
          <input [class]="fieldClass" value="Riverside Clinic" />
        </app-form-field>
        <app-form-field label="Licence number">
          <input [class]="fieldClass" class="font-mono" value="KMPDC/FAC/4482" />
        </app-form-field>
        <app-form-field label="Phone">
          <input [class]="fieldClass" value="+254 20 445 8890" />
        </app-form-field>
        <app-form-field label="Address">
          <input [class]="fieldClass" value="Riverside Drive, Nairobi" />
        </app-form-field>
      </div>
    </section>

    <section class="mb-4 rounded-[9px] border border-border bg-card">
      <div class="border-b border-border-soft px-4 py-3 text-[14px] font-semibold">Opening hours & appointment slots</div>
      <div class="grid grid-cols-1 gap-3.5 p-4 sm:grid-cols-3">
        <app-form-field label="Weekdays">
          <input [class]="fieldClass" value="08:00 – 18:00" />
        </app-form-field>
        <app-form-field label="Saturday">
          <input [class]="fieldClass" value="09:00 – 13:00" />
        </app-form-field>
        <app-form-field label="Slot length">
          <select [class]="fieldClass">
            <option>20 minutes</option>
            <option>15 minutes</option>
            <option>30 minutes</option>
          </select>
        </app-form-field>
      </div>
    </section>

    <section class="rounded-[9px] border border-border bg-card">
      <div class="border-b border-border-soft px-4 py-3 text-[14px] font-semibold">Audit log</div>
      <div class="px-4 pb-3.5">
        @for (entry of auditLog; track entry.time) {
          <div class="flex flex-col gap-1 border-b border-border-soft py-2.5 text-[12.5px] last:border-b-0 sm:flex-row sm:gap-3.5">
            <span class="w-[110px] flex-none font-mono text-text-subtle">{{ entry.time }}</span>
            <span class="text-secondary-foreground">{{ entry.text }}</span>
          </div>
        }
      </div>
    </section>
  </div>
</div>
